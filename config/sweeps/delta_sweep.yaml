# Parameter sweep over the steering correction magnitude δ (eq. 3.26).
#
# Run with:
#   python3 scripts/run_sweep.py config/sweeps/delta_sweep.yaml
#
# Each run launches the simulation with its `params` applied on top of the
# controller's built-in defaults, waits `wait_seconds`, captures a snapshot
# (PNG + CSVs) to sweep_output/<output_name>/<run.name>/, then cleans up.
#
# Range: -15° … +15° in 1° steps, matching the paper's δ_max = 15°.
# Stays exactly at the saturation boundary so no per-run delta_max override is
# needed. With the default a_min/a_max (5° / 50°) and alpha_distribution
# [2.5, 1.5, 0.5, -0.5, -1.5, -2.5], the most-amplified joint reaches
# A_h + 2.5·δ_max ≈ 20° + 37.5° = 57.5° → clipped to a_max=50°.
# If you want unsaturated behavior across the full δ range, also override
# a_max (and a_min) in each run.

# Default wait time per run (seconds). Can be overridden per-run.
wait_seconds: 120

# Output folder under ./sweep_output/
output_name: delta_sweep_with_offset_sanity_check

# Parameters not listed here keep their defaults from the controller.
# Available parameters (see sidewinding_movement_controller.py):
#   A_v, A_h, delta_phi_v, delta_phi_h, delta_phi_vh, O_v, O_h, T, publish_rate,
#   alpha_distribution, delta, delta_offset, a_min, a_max, delta_max
runs:
  - name: delta_-30_deg
    params:
      delta: -0.5236

  - name: delta_-28_deg
    params:
      delta: -0.4887

  - name: delta_-26_deg
    params:
      delta: -0.4538

  - name: delta_-24_deg
    params:
      delta: -0.4189

  - name: delta_-22_deg
    params:
      delta: -0.3840

  - name: delta_-20_deg
    params:
      delta: -0.3491

  - name: delta_-18_deg
    params:
      delta: -0.3142

  - name: delta_-16_deg
    params:
      delta: -0.2793

  - name: delta_-14_deg
    params:
      delta: -0.2443

  - name: delta_-12_deg
    params:
      delta: -0.2094

  - name: delta_-10_deg
    params:
      delta: -0.1745

  - name: delta_-8_deg
    params:
      delta: -0.1396

