# Default parameters for the sidewinding movement controller.
# Loaded by snake_sim_launch.py unless `controller_params_file:=...` overrides it.
# The sweep driver (scripts/run_sweep.py) also reads this file and merges each
# run's overrides on top, then writes the effective parameters to the run's
# output directory.
movement_controller_node:
  ros__parameters:
    swivel_joint_count: 6
    sliding_pad_joint_count: 7
    A_v: 1.0                       # vertical wave amplitude (radians) — only sign matters
    A_h: 0.4800        # horizontal wave amplitude (radians) = 27.5 degreea
    delta_phi_v: 1.2               # vertical inter-module phase diff (radians)
    delta_phi_h: 1.2               # horizontal inter-module phase diff (radians)
    delta_phi_vh: 0.6981   # vertical-to-horizontal phase offset (radians) = 40 degrees
    O_v: 0.0                       # vertical wave phase offset (radians)
    O_h: 0.0                       # horizontal wave offset (radians)
    T: 5.0                         # wave period (seconds)
    publish_rate: 50.0             # Hz
