# Default parameters for the sidewinding movement controller.
# Loaded by snake_sim_launch.py unless `controller_params_file:=...` overrides it.
# The sweep driver (scripts/run_sweep.py) also reads this file and merges each
# run's overrides on top, then writes the effective parameters to the run's
# output directory.
movement_controller_node:
  ros__parameters:
    swivel_joint_count: 6
    sliding_pad_joint_count: 7
    A_v: 1.0                       # vertical wave amplitude (radians) — only sign matters
    A_h: 0.5236        # horizontal wave amplitude (radians) = 30 degrees
    delta_phi_v: 2.6928               # vertical inter-module phase diff (radians), kv=3.0
    delta_phi_h: 3.1416               # horizontal inter-module phase diff (radians), kh=3.0
    delta_phi_vh: 0.7854   # vertical-to-horizontal phase offset (radians) = 45 deg
    O_v: 0.0                       # vertical wave phase offset (radians)
    O_h: 0.0                       # horizontal wave offset (radians)
    T: 5.0                         # wave period (seconds)
    publish_rate: 50.0             # Hz

    # ---- Asymmetric amplitude distribution (eq. 3.26, 3.27) ----
    # Per-joint horizontal amplitude is computed as:
    #   A_h_i = clip(A_h + alpha_distribution[i] * delta + delta_offset, a_min, a_max)
    # With delta=0 and delta_offset=0 the gait reduces to the original symmetric
    # sidewinding (A_h_i == A_h for every joint), so existing sweep configs that
    # omit these fields keep their original behavior.
    #
    # alpha_distribution: weighting α_i along the body. Length must equal
    #   swivel_joint_count. The paper uses [2.0, 1.0, 0.0, -1.0, -2.0] for 5
    #   horizontal joints; here it is extended symmetrically about the midline
    #   for the 6 swivel joints.
    alpha_distribution: [2.5, 1.5, 0.5, -0.5, -1.5, -2.5]

    # delta: steering correction magnitude δ (radians). Modulated at runtime by
    # the trajectory tracking controller via std_msgs/Float64 on
    # /movement_controller/delta. The value here is the open-loop initial value
    # used until the first message arrives.
    delta: 0.0

    # delta_offset: feed-forward bias compensating systematic heading drift in
    # the nominal gait (eq. 3.31). Static; not modulated at runtime.
    delta_offset: 0.0

    # ---- Safety saturation (eq. 3.29, 3.30) ----
    # a_min/a_max bound the per-joint corrected horizontal amplitude.
    # delta_max bounds δ (whether from the parameter above or the topic).
    # Paper defaults for COBRA (Dynamixel XH540): 5° / 50° / 15°. In radians:
    a_min: 0.08727                 # 5 degrees
    a_max: 1.0472                  # 60 degrees
    delta_max: 0.1745             # 10 degrees
