trajectory_publisher:
  ros__parameters:
    # Trajectory type: 'waypoints', 'line', 'circle', 'sine'
    type: 'circle'

    # All parametric shapes (line / circle / sine) start at the robot's initial
    # COM, set here. Default is the snake's spawn COM ~(0, 0.36); no manual
    # origin offset is needed any more.
    start_x: 0.0
    start_y: 0.36

    # --- Line ---
    # Straight segment of `length` (m) from the start point. `angle` is the
    # heading in degrees CCW from +X: 0 -> +X, 90 -> +Y, -90 -> -Y.
    length: 2.0
    angle: 0.0

    # --- Circle ---
    # `radius` (m). The path leaves the start point heading +X and then curves
    # toward +Y ('ccw') or -Y ('cw').
    radius: 0.5
    direction: 'ccw'

    # --- Sine ---
    # Travels along +X from the start point; `amplitude` (m) is the Y swing.
    amplitude: 0.3
    wavelength: 1.0

    # --- Waypoints ---
    # Flat list of [x1, y1, x2, y2, ...] absolute points (NOT offset by start).
    # waypoints: [0.0, 0.36, 0.5, 0.46, 1.0, 0.36]

    # --- Path following ---
    # The desired point ("carrot") the tracker chases is the robot CoM
    # projected onto the path, then advanced this many metres ALONG the path
    # (arc length). Larger = smoother but cuts corners; smaller = tighter but
    # can oscillate. Past the end of an open path it extrapolates straight.
    lookahead_distance: 0.05

    # Number of interpolation points
    num_points: 100

    # Speed (m/s) along the curve. Only used to time-parametrize the published
    # /snake/desired_trajectory (e.g. for the CMA optimizer's offline scoring);
    # the live carrot above is driven by the CoM, not by time.
    linear_speed: 0.01
